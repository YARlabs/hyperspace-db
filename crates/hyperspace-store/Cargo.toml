[package]
name = "hyperspace-store"
version = "4.1.0"
edition = "2021"

[dependencies]
memmap2 = { workspace = true, optional = true }
byteorder = "1.5.0"
parking_lot.workspace = true
crc32fast = "1.5.0"
arc-swap = "1.7.1"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[features]
default = ["mmap"]
mmap = ["dep:memmap2"]
# Batched positional reads through Linux io_uring (no-op on other platforms).
io-uring = ["dep:io-uring"]

[dev-dependencies]
tempfile = "3.8"
proptest = "1.0"
