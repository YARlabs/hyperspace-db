[package]
name = "hyperspace-sdk"
version = "4.2.0"
edition = "2021"
authors = ["YARlabs <hi@yar.ink>"]
description = "Official Rust SDK for HyperspaceDB gRPC API"
homepage = "https://yar.ink"
repository = "https://github.com/YARlabs/hyperspace-db"
documentation = "https://yar.ink/docs"
license = "Apache-2.0"
readme = "README.md"
keywords = ["vector-database", "ann", "grpc", "hnsw", "hyperspace"]
categories = ["database", "api-bindings"]

[features]
default = []
nightly-simd = []
embedders = ["dep:reqwest", "dep:async-trait"]
local-onnx = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:async-trait"]
huggingface = ["local-onnx", "dep:hf-hub"]

[dependencies]
hyperspace-proto = { path = "../hyperspace-proto", version = "4.2.0" }
tonic = "0.10"
tokio = { version = "1.35", features = ["full"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
hmac = "0.12"
parking_lot = "0.12"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Embedder dependencies (Optional)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], optional = true }
async-trait = { version = "0.1", optional = true }
rand = "0.10.0"

# Local ONNX (optional)
ort = { version = "2.0.0-rc.12", features = ["download-binaries"], optional = true }
tokenizers = { version = "0.15", features = ["onig"], optional = true }
ndarray = { version = "0.17", optional = true }

# HuggingFace Hub (optional)
hf-hub = { version = "0.3", optional = true }

[dev-dependencies]
proptest.workspace = true
