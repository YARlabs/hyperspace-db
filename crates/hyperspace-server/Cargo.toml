[package]
name = "hyperspace-server"
version = "3.1.3"
default-run = "hyperspace-server"
edition = "2021"

[dependencies]
tokio = { workspace = true }
tonic = { workspace = true, features = ["tls"] }
tracing = { workspace = true }
hyperspace-proto = { workspace = true }
hyperspace-core = { workspace = true, features = ["gpu-runtime"] }
hyperspace-index = { workspace = true }
hyperspace-store = { workspace = true }
hyperspace-cache = { workspace = true }
tokio-stream = "0.1"
rand = "0.8"
sha2 = "0.10.9"
hex = "0.4.3"
clap = { version = "4.5.54", features = ["derive", "env"] }
dotenv = "0.15.0"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.149"
redb = "4.1.0"
chrono = "0.4"
base64 = "0.22"
dashmap = "6.1.0"
arc-swap = "1.7"
axum = "0.8.8"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
tower-http = { version = "0.6.8", features = ["cors", "trace", "fs"] }
sysinfo = "0.32"
tokio-rustls = "0.26"
rustls-pemfile = "1.0.4"
rustls-pki-types = "1.14"
hyper = { version = "1.8", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower-service = "0.3"
hyperspace-embed = { path = "../hyperspace-embed", optional = true }
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = "0.6"
prometheus = { version = "0.13", features = ["process"] }
rayon = "1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1.7", features = ["v4", "serde"] }
parking_lot.workspace = true
async-trait = "0.1.89"
async-stream = "0.3.5"
tempfile = "3.10"
futures = "0.3.32"
ordered-float = "3"
hyperspace-tiering = { workspace = true, optional = true }
hyperspace-eco = { workspace = true, optional = true }
hyperspace-p2p = { workspace = true, optional = true }
hyperspace-billing = { workspace = true, optional = true }

[features]
default = ["embed"]
embed = ["dep:hyperspace-embed"]
nightly-simd = ["hyperspace-core/nightly-simd", "hyperspace-index/nightly-simd"]
# S3 tiering: optional cloud storage for cold chunks.
# Not compiled by default — edge devices get zero cloud dependencies.
# Enable with: cargo build --features s3-tiering
s3-tiering = ["dep:hyperspace-tiering"]
eco-monitor = ["dep:hyperspace-eco", "hyperspace-eco?/eco-monitor"]
depin = ["dep:hyperspace-p2p", "dep:hyperspace-billing"]

[[bin]]
name = "hyperspace-server"
path = "src/main.rs"

[[bin]]
name = "hyperspace-miner"
path = "src/bin/hyperspace-miner.rs"
required-features = ["depin"]
