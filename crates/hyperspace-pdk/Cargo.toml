[package]
name = "hyperspace-pdk"
version = "4.2.0"
edition = "2021"
description = "Plugin Development Kit (PDK) and standard extension library for HyperspaceDB"

[dependencies]
hyperspace-core = { path = "../hyperspace-core" }
anyhow = "1.0"
async-trait = "0.1"
dashmap = "6.1"
hex = "0.4"
hf-hub = "0.3"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
parking_lot = "0.12"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tokenizers = { version = "0.22.2", features = ["onig"] }

[features]
default = []
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

