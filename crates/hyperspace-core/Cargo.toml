[package]
name = "hyperspace-core"
version = "4.2.0"
edition = "2021"

[dependencies]
rand = "~0.8"
serde = { workspace = true }
serde_json = "1.0"
async-trait = "0.1.89"
roaring = "0.11.3"
parking_lot = { workspace = true }
wgpu = { version = "*", optional = true }
pollster = { version = "*", optional = true }
bytemuck = { version = "*", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest.workspace = true

[[bench]]
name = "metric_bench"
harness = false

[[bench]]
name = "gpu_dispatch_bench"
harness = false

[[bench]]
name = "graph_vs_dual"
harness = false

[features]
default = []
nightly-simd = []
gpu-runtime = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
