[package]
name = "hyperspace-cache"
version = "0.1.0"
edition = "2021"

[dependencies]
hyperspace-core = { path = "../hyperspace-core" }

dashmap = "6.1.0"
parking_lot = "0.12"
arc-swap = "1.7"
bytes = "1"
tokio = { version = "1.35", features = ["sync", "time", "rt", "macros"] }
instant-distance = "0.6.1"      # pure-Rust HNSW for L2
crossbeam-epoch = "0.9"
prometheus = { version = "0.13", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1.35", features = ["full"] }
proptest = "1.0"

[[bench]]
name = "cache_bench"
harness = false
