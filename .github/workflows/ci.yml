name: HyperspaceDB CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info
  ORT_STRATEGY: system
  ORT_LIB_LOCATION: /home/runner/onnxruntime/lib
  ORT_PREFER_DYNAMIC_LINK: "true"
  LD_LIBRARY_PATH: /home/runner/onnxruntime/lib

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Install Protoc (Required for tonic-build)
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Download and Extract ONNX Runtime for building ort-sys
      - name: Download and Extract ONNX Runtime
        run: |
          mkdir -p /home/runner/onnxruntime
          curl -L https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-linux-x64-1.19.2.tgz -o /home/runner/onnxruntime.tgz
          tar -xzf /home/runner/onnxruntime.tgz -C /home/runner/onnxruntime --strip-components=1

      # Install Rust Nightly
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js (Dashboard)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build

      # 1. Check Formatting
      - name: Check SDK protobuf stubs match hyperspace.proto
        run: python3 scripts/check_sdk_protos.py

      - name: Check Formatting
        run: cargo fmt --all -- --check

      # 2. Build
      - name: Build
        run: cargo build --verbose

      # 3. Test
      - name: Run Tests
        # Run all tests, including doc tests
        run: cargo test --workspace --verbose

      # 4. Clippy (Linter)
      - name: Run Clippy
        # Fail on warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  sdk-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Install Protoc (Required for tonic-build)
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Download and Extract ONNX Runtime for building ort-sys
      - name: Download and Extract ONNX Runtime
        run: |
          mkdir -p /home/runner/onnxruntime
          curl -L https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-linux-x64-1.19.2.tgz -o /home/runner/onnxruntime.tgz
          tar -xzf /home/runner/onnxruntime.tgz -C /home/runner/onnxruntime --strip-components=1

      # Install Rust Nightly
      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build

      - name: Check SDK protobuf stubs match hyperspace.proto
        run: python3 scripts/check_sdk_protos.py

      - name: Start HyperspaceDB Server
        run: |
          cargo build --release -p hyperspace-server
          HS_DATA_DIR=$RUNNER_TEMP/hs-data ./target/release/hyperspace-server --port 50051 --http-port 50050 &
          for i in $(seq 1 120); do
            (echo > /dev/tcp/127.0.0.1/50051) 2>/dev/null && exit 0
            sleep 1
          done
          echo "server did not open port 50051" && exit 1

      - name: Test TS SDK
        run: |
          cd sdks/ts
          npm install
          npm run build
          npm test

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Test Python SDK
        run: |
          cd sdks/python
          pip install ./  # installs declared dependencies; fails if one is missing
          python test_request_options.py

      - name: Recall gate (quantization sweep, quick)
        run: |
          pip install numpy
          HS_BENCH_GRPC_PORT=56051 python benchmarks/run_quantization_sweep.py --quick --no-report \
            --filter none_ef100,medium_rerank4,turbo_rerank4,ternary_rerank4,extreme_rerank8,pq4_rerank8 \
            --min-recall none_ef100=96,medium_rerank4=97,turbo_rerank4=97,ternary_rerank4=97,extreme_rerank8=95,pq4_rerank8=97

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Test Go SDK
        run: |
          cd sdks/go
          go vet ./...
          go test ./...

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: Test Dart SDK
        run: |
          cd sdks/dart
          dart pub get
          dart analyze --fatal-infos
          dart format --output=none --set-exit-if-changed lib test
          HS_TEST_PORT=50051 dart test
          HS_TEST_PORT=50051 HS_TEST_COMPACT=1 dart test

  wasm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: |
          cd crates/hyperspace-wasm
          wasm-pack build --target web
