# Kubernetes Network Policy Template for HyperspaceDB
# Restricts inbound TCP traffic to database ports (gRPC 50051, HTTP 8080)
# to only authorized client pods (e.g., API Gateway / Kong).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hyperspacedb-network-policy
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: hyperspace-db
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Allow traffic only from pods with label 'app: gateway' or 'app: kong'
    - podSelector:
        matchLabels:
          app: kong
    # Optionally allow traffic from other specific namespaces
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: supabase
      podSelector:
        matchLabels:
          app.kubernetes.io/name: supabase
    ports:
    - protocol: TCP
      port: 50051 # gRPC Data Plane
    - protocol: TCP
      port: 50050 # HTTP Management API (Adjust if 8080 or other port is used)
