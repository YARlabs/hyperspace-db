# Nginx mTLS / TLS 1.3 Reverse Proxy Configuration Template
# For secure communication between HyperspaceDB nodes and clients.

server {
    listen 443 ssl http2;
    server_name db.hyperspace.local;

    # SSL Server Certificates
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Enable Mutual TLS (mTLS) client verification
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # Force TLS 1.3 only
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Forward gRPC requests to local HyperspaceDB instance
    location / {
        grpc_pass grpc://127.0.0.1:50051;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;

        # Forward mTLS context headers to backendСУБД
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-SSL-Client-Verify $ssl_client_verify;
        grpc_set_header X-SSL-Client-DN $ssl_client_s_dn;
    }
}

server {
    listen 8443 ssl;
    server_name db.hyperspace.local;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Forward HTTP Management requests to local HyperspaceDB instance
    location / {
        proxy_pass http://127.0.0.1:50050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
