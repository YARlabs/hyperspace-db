[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
tonic = "0.10"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "1.0"
# Local crates
hyperspace-core = { path = "crates/hyperspace-core" }
hyperspace-proto = { path = "crates/hyperspace-proto" }
hyperspace-index = { path = "crates/hyperspace-index" }
hyperspace-store = { path = "crates/hyperspace-store" }
hyperspace-tiering = { path = "crates/hyperspace-tiering" }
hyperspace-cache = { path = "crates/hyperspace-cache" }
hyperspace-eco = { path = "crates/hyperspace-eco" }
memmap2 = "0.9"
parking_lot = "0.12"
ratatui = "0.24" # Check recent version or use what fits
rkyv = "0.7"
smallvec = "1.11"
proptest = "1.0"
# Local DePIN crates
hyperspace-p2p = { path = "crates/hyperspace-p2p" }
hyperspace-billing = { path = "crates/hyperspace-billing" }

# DePIN dependencies
libp2p = { version = "0.53", features = ["tcp", "dns", "websocket", "noise", "yamux", "kad", "gossipsub", "identify", "autonat", "tokio", "quic", "macros", "ed25519"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
blake3 = "1.5"
zeroize = { version = "1.7", features = ["derive"] }
bip39 = { version = "2.0", features = ["rand"] }
rs_merkle = "1.4"
governor = "0.6"
dashmap = "6.1.0"
redb = "4.1.0"
# Local ONNX embedder stack (shared by hyperspace-embed + optional sdk features)
# load-dynamic + hardcoded dylib path in embed crate for Paulina's macOS ORT install
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-20", "tracing", "coreml"] }
tokenizers = { version = "0.22.2", features = ["onig"] }
ndarray = "0.17"
hf-hub = "0.3"


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
